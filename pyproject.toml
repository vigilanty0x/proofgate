[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "trustkit"
version = "0.1.0"
description = "Fail-closed defensive policy core for the TrustKit consolidation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trustkit = "trustkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
