name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public boundary
        run: PYTHONPATH=src python scripts/check.py
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run functional counter-proof
        run: PYTHONPATH=src python -m status_truth probe functional
      - name: Exercise healthy and failing fixtures
        run: |
          PYTHONPATH=src python -m status_truth assess --input examples/healthy.json --journal /tmp/status-truth.jsonl
          set +e
          PYTHONPATH=src python -m status_truth assess --input examples/failure.json --journal /tmp/status-truth.jsonl
          code=$?
          set -e
          test "$code" -eq 2
          PYTHONPATH=src python -m status_truth verify --journal /tmp/status-truth.jsonl
