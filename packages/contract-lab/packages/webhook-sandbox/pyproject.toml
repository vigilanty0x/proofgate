[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="webhook-sandbox"
version="0.1.0"
description="Offline bounded webhook inspection and replay evidence"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
webhook-sandbox="webhook_sandbox:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
