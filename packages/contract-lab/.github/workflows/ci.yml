name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-lab-core:
    name: contract-lab core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build tooling
        run: >-
          python -m pip install --disable-pip-version-check
          "setuptools==83.0.0" "wheel==0.45.1"
      - name: Build root wheel without dependency resolution
        env:
          PIP_NO_INDEX: "1"
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Install root wheel without dependency resolution
        env:
          PIP_NO_INDEX: "1"
        run: python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
      - name: Root unit and counter-proof tests
        run: python -m unittest discover -s tests -v
      - name: Compile root sources and tests
        run: python -m compileall -q src tests
      - name: Import installed root artifact outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "import contract_lab; assert contract_lab.__version__ == '0.1.0'"
      - name: Installed roundtrip smoke outside checkout
        working-directory: ${{ runner.temp }}
        run: contract-lab roundtrip "$GITHUB_WORKSPACE/examples/roundtrip.json"
      - name: Installed compatible-evolution smoke outside checkout
        working-directory: ${{ runner.temp }}
        run: contract-lab evolve "$GITHUB_WORKSPACE/examples/old-schema.json" "$GITHUB_WORKSPACE/examples/new-compatible-schema.json"
      - name: Installed breaking-evolution counter-proof outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set +e
          contract-lab evolve "$GITHUB_WORKSPACE/examples/old-schema.json" "$GITHUB_WORKSPACE/examples/new-breaking-schema.json"
          code=$?
          set -e
          test "$code" -eq 1

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        package:
          - api-contract-mock-server
          - schema-contract-tester
          - webhook-sandbox
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build tooling
        run: >-
          python -m pip install --disable-pip-version-check
          "setuptools==83.0.0" "wheel==0.45.1"
      - name: Build wheel without dependency resolution
        env:
          PIP_NO_INDEX: "1"
        run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
      - name: Install wheel without dependency resolution
        env:
          PIP_NO_INDEX: "1"
        run: python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
      - name: Install offline verification guard
        run: |
          mkdir -p "$RUNNER_TEMP/offline-python"
          cat > "$RUNNER_TEMP/offline-python/sitecustomize.py" <<'PY'
          import socket

          _socket = socket.socket


          class OfflineSocket(_socket):
              def __init__(self, family=socket.AF_INET, *args, **kwargs):
                  if family in (socket.AF_INET, socket.AF_INET6):
                      raise OSError("network disabled during verification")
                  super().__init__(family, *args, **kwargs)


          def _blocked(*_args, **_kwargs):
              raise OSError("network disabled during verification")


          socket.socket = OfflineSocket
          socket.create_connection = _blocked
          socket.getaddrinfo = _blocked
          PY
          PYTHONPATH="$RUNNER_TEMP/offline-python" python - <<'PY'
          import socket

          try:
              socket.socket()
          except OSError as error:
              assert str(error) == "network disabled during verification"
          else:
              raise SystemExit("offline verification guard is inactive")
          PY
      - name: Compile sources without network
        env:
          PIP_NO_INDEX: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
          PYTHONPATH: ${{ runner.temp }}/offline-python
        run: python -m compileall -q -f src
      - name: Unit tests without network
        env:
          PIP_NO_INDEX: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
          PYTHONPATH: ${{ runner.temp }}/offline-python
        run: python -m unittest discover -s tests -v
      - name: Repository checks without network
        env:
          PIP_NO_INDEX: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
          PYTHONPATH: ${{ runner.temp }}/offline-python
        run: python scripts/check.py
