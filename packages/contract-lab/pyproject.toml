[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-lab"
version = "0.1.0"
description = "Offline contract normalization, schema evolution, replay, and webhook proof core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contract-lab = "contract_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
