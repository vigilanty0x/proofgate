name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate example
        run: proofgate validate examples/proofgate.json --json
      - name: Run example gate
        run: proofgate run examples/proofgate.json --root . --journal /tmp/proofgate-events.jsonl --idempotency-key ci-${{ matrix.python-version }} --json
      - name: Replay example journal
        run: proofgate replay /tmp/proofgate-events.jsonl --json

