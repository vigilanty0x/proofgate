name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: Build pinned release artifact
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install built release artifact
        run: python -m pip install --force-reinstall --no-deps dist/proofgate-0.2.0-py3-none-any.whl
      - name: Smoke-test installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: proofgate --version
      - name: Validate example
        run: proofgate validate examples/proofgate.json --json
      - name: Run example gate
        run: proofgate run examples/proofgate.json --root . --journal /tmp/proofgate-events.jsonl --idempotency-key ci-${{ matrix.python-version }} --json
      - name: Replay example journal
        run: proofgate replay /tmp/proofgate-events.jsonl --json
