name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate monorepo manifest
        run: python scripts/check_monorepo.py
      - name: Verify release and consolidation policy
        run: python scripts/check_release_policy.py
      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "wheel==0.45.1"
      - name: Build wheel and sdist
        run: python -m build
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; wheels=glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"
      - name: Unit tests against installed artifact
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: Smoke-test installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: proofgate --version
      - name: Validate example
        run: proofgate validate examples/proofgate.json --json
      - name: Counter-proof must fail closed
        run: python -c "import subprocess, sys; r=subprocess.run(['proofgate','check','examples/proofgate.json','--root','.','--json']); print('expected exit=2 actual=', r.returncode); sys.exit(0 if r.returncode == 2 else 1)"
      - name: Run example gate
        run: proofgate run examples/proofgate.json --root . --journal "${{ runner.temp }}/proofgate-events.jsonl" --idempotency-key "ci-${{ matrix.os }}-${{ matrix.python-version }}" --json
      - name: Replay example journal
        run: proofgate replay "${{ runner.temp }}/proofgate-events.jsonl" --json
      - name: Generate release evidence bundle
        run: python scripts/release_evidence.py --dist dist

  package-tests:
    name: ${{ matrix.package }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package:
          - audit-trail-lite
          - evidence-ledger
          - run-replay
          - status-truth
          - structured-output-guard
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==80.9.0" "wheel==0.45.1"
      - name: Build package wheel
        run: python -m build --no-isolation --wheel
      - name: Install package wheel
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
      - name: Run package static checks
        run: python scripts/check.py
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Compile package sources and tests
        run: python -m compileall -q src tests
      - name: Import installed artifact outside checkout
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_MODULE: ${{ matrix.package }}
        run: python -c "import importlib, os; importlib.import_module(os.environ['PACKAGE_MODULE'].replace('-', '_'))"

  imported-suite-tests:
    name: ${{ matrix.suite }} / imported suite / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trustkit
            module: trustkit
          - suite: contract-lab
            module: contract_lab
    defaults:
      run:
        working-directory: packages/${{ matrix.suite }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==83.0.0" "wheel==0.45.1"
      - name: Build imported suite wheel
        run: python -m build --no-isolation --wheel
      - name: Install imported suite wheel
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
      - name: Run imported suite tests
        run: python -m unittest discover -s tests -v
      - name: Compile imported suite sources and tests
        run: python -m compileall -q src tests
      - name: Import installed artifact outside checkout
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_MODULE: ${{ matrix.module }}
        run: python -c "import importlib, os; importlib.import_module(os.environ['PACKAGE_MODULE'])"

  imported-suite-package-tests:
    name: ${{ matrix.package }} / imported package / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trustkit
            package: env-example-guard
          - suite: trustkit
            package: permission-matrix
          - suite: trustkit
            package: secrets-hygiene
          - suite: trustkit
            package: security-headers-lab
          - suite: trustkit
            package: ssrf-guard-demo
          - suite: contract-lab
            package: api-contract-mock-server
          - suite: contract-lab
            package: schema-contract-tester
          - suite: contract-lab
            package: webhook-sandbox
    defaults:
      run:
        working-directory: packages/${{ matrix.suite }}/packages/${{ matrix.package }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==83.0.0" "wheel==0.45.1"
      - name: Build package wheel
        run: python -m build --no-isolation --wheel
      - name: Install package wheel
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
      - name: Run package static checks
        run: python scripts/check.py
      - name: Run package tests
        run: python -m unittest discover -s tests -v
      - name: Compile package sources and tests
        run: python -m compileall -q src tests
      - name: Import installed artifact outside checkout
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_MODULE: ${{ matrix.package }}
        run: python -c "import importlib, os; importlib.import_module(os.environ['PACKAGE_MODULE'].replace('-', '_'))"
