name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-packages:
    name: ${{ matrix.package }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        package:
          - env-example-guard
          - permission-matrix
          - secrets-hygiene
          - security-headers-lab
          - ssrf-guard-demo
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build tooling
        run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==83.0.0" "wheel==0.45.1"
      - name: Build wheel
        working-directory: packages/${{ matrix.package }}
        run: python -m build --no-isolation --wheel
      - name: Install built wheel
        working-directory: packages/${{ matrix.package }}
        run: python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
      - name: Unit and adversarial tests
        working-directory: packages/${{ matrix.package }}
        run: python -m unittest discover -s tests -v
      - name: Public-boundary checks
        working-directory: packages/${{ matrix.package }}
        run: python scripts/check.py
      - name: Compile sources and tests
        working-directory: packages/${{ matrix.package }}
        run: python -m compileall -q src tests
      - name: Import installed artifact outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_MODULE: ${{ matrix.package }}
        run: python -c "import importlib, os; importlib.import_module(os.environ['PACKAGE_MODULE'].replace('-', '_'))"
      - name: Installed CLI example smoke outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: '"$PACKAGE" "$GITHUB_WORKSPACE/packages/$PACKAGE/examples/basic.json"'
